name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Detect version-only commits (e.g. "0.1.1" from npm version patch).
  # The test job skips when code hasn't changed — typecheck/build still
  # run so CI reports success for the npm-publish workflow to wait on.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      should-test: ${{ steps.check.outputs.should-test }}
    steps:
      - id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          if echo "$FIRST_LINE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version-only commit detected ($FIRST_LINE) — skipping test job"
            echo "should-test=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-test=true" >> "$GITHUB_OUTPUT"
          fi

  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build server + client
        run: npm run build

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.should-test == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # node:sqlite (used by the storage adapter + tests) needs 22.5+
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
